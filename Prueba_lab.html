<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>

        .AplicarGrid {
            display: grid;
            gap: 1.5rem;
            grid-template-areas: 
                "Navega"
                "heroe"
                "princi";
            grid-template-columns: 1fr ; /* 1 sola columna en móvil */
        }

       
        .Navega{
            grid-area: Navega;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: aquamarine;
            padding: 15px;
        }

        .Navega a{
            color: black;
            text-decoration: none;
        }

        .heroe{
            grid-area: heroe;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60vh;
            background-color: chartreuse;
            text-align: center;
        }

        .heroe.Oscuro{
            background-color: black;
        }
        
        .princi{
            grid-area: princi;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            padding: 40px;
            justify-items: center;
            justify-content: center;
        }

        .carta{
            width: 80%;   
            max-width: 400px;
            background-color: brown;
            border: 1px solid olive;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px black;
        }

        h1 {
            color: #9e0cd8;
            text-align: center;
            font-family: 	Comic Sans MS;
            font-size: 30px;
        }

         @media (min-width: 780px){

            .princi{grid-template-columns: repeat(2, minmax(300px, 400px));}
        }

        @media (min-width: 1028px){

            .princi {grid-template-columns:auto ;}
        }


        </style>
    </head>
<body>

    <div class="AplicarGrid">
        
        <nav class="Navega">
            <a href="#inicio">Inicio</a>
            <a href="#caracteristicas">Caracteristicas</a>
            <a href="#contactos"> Contactos</a>
        </nav>

    
        <header class="heroe">

            <div class="Contenido">

                <h1> el diseno grafico es mi pasion </h1>

                <form action="/enviar" method="post">

                    <label for="nombre"> nombre </label>
                    <input type="text"
                    id="nombre" required>

                    <label for="correo"> Correo </label>
                    <input type="email"
                    id="correo" required>

                    <label for="mensaje"> Mensaje </label>
                    <textarea name="mensaje" id="mensaje"></textarea>
                
                    <button type="submit"> enviar </button>
                </form>
            </div>

        </header>

        <main class="princi">
            <div class="carta">

                <h3> titulo 1 </h3>
                <p id="Saludo">aca habra contenido</p>

            </div>
            <div class="carta">

                <h3> titulo 2</h3>
                <p> informacion importante aca </p>

            </div>
        </main>
<div class="buttons">

  <button class="button is-success is-dark" id="Cambio">Cambio fondo</button>
  
</div>
    </div>
</body>

<script src ="CodigoJava.js" defer> </script>

</html>
